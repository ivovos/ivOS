<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract Countdown</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --text: #f0f0f0;
      --muted: #888;
      --accent: #c8ff00;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      text-align: center;
      max-width: 640px;
      width: 100%;
    }

    .label {
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .days-number {
      font-size: clamp(6rem, 20vw, 14rem);
      font-weight: 800;
      line-height: 1;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .days-label {
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--muted);
      margin-top: 0.25rem;
      margin-bottom: 3rem;
    }

    .breakdown {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .breakdown-item {
      background: var(--surface);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      min-width: 100px;
    }

    .breakdown-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .breakdown-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.25rem;
    }

    .progress-container {
      margin-top: 3rem;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--surface);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 0.75rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .contract-done .days-number {
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="label">Contract ends 30 June 2026</div>
    <div class="days-number" id="daysNumber">—</div>
    <div class="days-label" id="daysLabel">days remaining</div>

    <div class="breakdown">
      <div class="breakdown-item">
        <div class="breakdown-value" id="months">—</div>
        <div class="breakdown-label">Months</div>
      </div>
      <div class="breakdown-item">
        <div class="breakdown-value" id="weeks">—</div>
        <div class="breakdown-label">Weeks</div>
      </div>
      <div class="breakdown-item">
        <div class="breakdown-value" id="workdays">—</div>
        <div class="breakdown-label">Work days</div>
      </div>
    </div>

    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
      <div class="progress-labels">
        <span>Jan 2025</span>
        <span id="progressPercent">0%</span>
        <span>Jun 2026</span>
      </div>
    </div>
  </div>

  <script>
    const CONTRACT_START = new Date('2025-01-01T00:00:00');
    const CONTRACT_END = new Date('2026-06-30T23:59:59');

    function countWorkdays(from, to) {
      let count = 0;
      const current = new Date(from);
      current.setHours(0, 0, 0, 0);
      const end = new Date(to);
      end.setHours(0, 0, 0, 0);
      while (current <= end) {
        const day = current.getDay();
        if (day !== 0 && day !== 6) count++;
        current.setDate(current.getDate() + 1);
      }
      return count;
    }

    function update() {
      const now = new Date();
      const msLeft = CONTRACT_END - now;
      const totalMs = CONTRACT_END - CONTRACT_START;

      if (msLeft <= 0) {
        document.getElementById('daysNumber').textContent = '0';
        document.getElementById('daysLabel').textContent = 'Contract complete';
        document.getElementById('months').textContent = '0';
        document.getElementById('weeks').textContent = '0';
        document.getElementById('workdays').textContent = '0';
        document.getElementById('progressFill').style.width = '100%';
        document.getElementById('progressPercent').textContent = '100%';
        document.querySelector('.container').classList.add('contract-done');
        return;
      }

      const days = Math.ceil(msLeft / (1000 * 60 * 60 * 24));
      const weeks = Math.floor(days / 7);
      const months = Math.round((days / 30.44) * 10) / 10;
      const workdays = countWorkdays(now, CONTRACT_END);
      const progress = Math.min(((totalMs - msLeft) / totalMs) * 100, 100);

      document.getElementById('daysNumber').textContent = days;
      document.getElementById('months').textContent = months.toFixed(1);
      document.getElementById('weeks').textContent = weeks;
      document.getElementById('workdays').textContent = workdays;
      document.getElementById('progressFill').style.width = progress.toFixed(1) + '%';
      document.getElementById('progressPercent').textContent = progress.toFixed(0) + '%';
    }

    update();
    setInterval(update, 60000);
  </script>
</body>
</html>
