    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #F5F1EB;
      --bg-card: #EDEAE4;
      --text: #1A1A1A;
      --text-muted: #6B6560;
      --accent: #3D3A36;
      --border: #D6D1CA;
      --tag-bg: #E2DED7;
      --tag-active-bg: #1A1A1A;
      --tag-active-text: #F5F1EB;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 24px 40px;
    }

    .header h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }

    .header p {
      font-size: 1.05rem;
      color: var(--text-muted);
      max-width: 560px;
      line-height: 1.6;
    }

    /* ── Filters ── */
    .filters {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 40px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-btn {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--tag-active-bg);
      color: var(--tag-active-text);
      border-color: var(--tag-active-bg);
    }

    /* ── Grid ── */
    .grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 120px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
    }

    /* ── Card ── */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      transition: opacity 0.4s ease, transform 0.4s ease;
      cursor: default;
    }

    .card.hidden {
      display: none;
    }

    .card:hover .card-image {
      transform: scale(1.03);
    }

    .card-image-wrap {
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      position: relative;
    }

    .card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
      display: block;
    }

    .card-body {
      padding: 20px 22px 24px;
    }

    .card-studio {
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .card-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 1.45rem;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 14px;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 0.72rem;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 100px;
      background: var(--tag-bg);
      color: var(--text-muted);
    }

    /* ── Colour blocks for card images ── */
    .colour-block {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 1.4rem;
      color: rgba(255,255,255,0.85);
      letter-spacing: -0.01em;
      text-align: center;
      padding: 20px;
      transition: transform 0.5s ease;
    }

    .card:hover .colour-block {
      transform: scale(1.03);
    }

    /* ── Empty state ── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    /* ── Footer ── */
    .footer {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 60px;
      text-align: center;
    }

    .footer p {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .header { padding: 48px 20px 28px; }
      .filters { padding: 0 20px 28px; }
      .grid {
        padding: 0 20px 80px;
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }
  </style>
</head>

        const card = document.createElement('article');
        card.className = 'card';
        card.style.animationDelay = `${i * 40}ms`;
        card.innerHTML = `
          <div class="card-image-wrap">
            <div class="colour-block" style="background:${p.colour}; color:${textColour}">
              ${p.studio.split('—')[0].trim()}
            </div>
          </div>
          <div class="card-body">
            <div class="card-studio">${p.studio} &middot; ${p.handle}</div>
            <h2 class="card-title">${p.title}</h2>
            <p class="card-desc">${p.desc}</p>
            <div class="card-tags">
              ${p.categories.map(c => `<span class="tag">${categoryLabel(c)}</span>`).join('')}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function categoryLabel(slug) {
      const labels = {
        'brand-identity': 'Brand Identity',
        'digital-product': 'Digital Product',
        'packaging': 'Packaging',
        'consumer-tech': 'Consumer Tech',
        'food-bev': 'Food & Beverage',
        'dtc-startup': 'DTC & Startup',
        'interactive': 'Interactive & Web',
      };
      return labels[slug] || slug;
    }

    function isLight(hex) {
      const c = hex.replace('#', '');
      const r = parseInt(c.substr(0, 2), 16);
      const g = parseInt(c.substr(2, 2), 16);
      const b = parseInt(c.substr(4, 2), 16);
      return (r * 299 + g * 587 + b * 114) / 1000 > 160;
    }

    // ── Filter clicks ──
    filtersEl.addEventListener('click', (e) => {
      if (!e.target.classList.contains('filter-btn')) return;
      filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      renderCards(e.target.dataset.filter);
    });

    // ── Init ──
    renderCards('all');
  </script>
</body>
</html>
